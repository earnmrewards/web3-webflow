<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alchemy Web3 Embed System for Webflow</title>
  </head>
  <body>
    <div id="root" feature="token-exchange"></div>
    <script type="module" src="/src/main.tsx"></script>

    <div
      class="h-screen w-screen flex flex-col gap-2 items-center justify-center bg-zinc-100"
    >
      <!-- Log In -->
      <div
        id="web3-log-in-container"
        class="block space-y-2 p-4 border bg-zinc-50 rounded text-center"
      >
        Log In Container
        <button
          class="mt-2 px-2 py-1 rounded bg-white shadow border"
          id="web3-auth-modal-button"
        >
          Open Auth Modal
        </button>
      </div>

      <div
        id="web3-exchange-container"
        class="block space-y-4 p-4 border bg-zinc-50 rounded"
        style="display: none"
      >
        <div
          id="web3-token-selector"
          class="w-full flex gap-2 items-center justify-center"
        >
          <button class="px-2 rounded transition-colors">EarnM</button>
          <button class="px-2 rounded transition-colors">StormX</button>
        </div>

        <div>
          <input
            placeholder="10"
            id="web3-amount"
            class="text-center"
            type="number"
          />

          <select name="networks" id="web3-network-selector" disabled>
            <option value="polygon">POL</option>
            <option value="arbitrum">ARB</option>
            <option value="base">BASE</option>
          </select>
        </div>

        <button id="web3-exchange-button" class="w-full bg-gray-100 rounded">
          Exchange
        </button>
      </div>

      <span id="web3-error-text" class="text-center"></span>
      <button
        class="px-2 py-1 rounded bg-white shadow border"
        id="web3-logout-button"
      >
        Logout
      </button>
    </div>
  </body>
</html>
