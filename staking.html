<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alchemy Web3 Embed System for Webflow</title>
  </head>
  <body>
    <div id="root" feature="staking"></div>
    <script type="module" src="/src/main.tsx"></script>

    <div class="p-12 h-screen w-screen flex justify-center bg-[#181818]">
      <div class="flex flex-col w-full max-w-4xl space-y-12">
        <a
          id="web3-address-button"
          class="self-end px-4 py-2 bg-[#02D632] rounded-full w-fit font-bold cursor-pointer"
        >
        </a>

        <div class="bg-[#F9FD30] h-fit py-4 rounded-lg text-sm text-center">
          Claim Your Rewards in: <strong>02d 12h 30m 00s</strong>
        </div>
        <div class="bg-[#F9FD30] h-fit py-4 rounded-lg text-sm text-center">
          It's time! Claim your reward now and enjoy!
          <button class="underline font-bold">Claim Now</button>
        </div>

        <h1 class="text-4xl font-bold text-white text-center">Dashboard</h1>

        <div class="grid grid-cols-2 gap-4">
          <div class="p-2 w-full flex border border-white rounded text-white">
            Available SmartNodes
          </div>
          <div class="p-2 w-full flex border border-white rounded text-white">
            Available SmartNodes
          </div>
          <div class="p-2 w-full flex border border-white rounded text-white">
            Reward for January 2025
          </div>
          <div class="p-2 w-full flex border border-white rounded text-white">
            Reward for February 2025
          </div>
        </div>

        <div class="flex items-center gap-8">
          <button class="py-2 w-full bg-[#02D632] rounded-full font-bold">
            Stake More SmartNodes
          </button>
          <button class="py-2 w-full bg-white rounded-full font-bold">
            Buy More SmartNodes
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
