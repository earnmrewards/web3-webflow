<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alchemy Web3 Embed System for Webflow</title>
  </head>
  <body>
    <div id="root" feature="staking"></div>
    <script type="module" src="/src/main.tsx"></script>

    <div
      id="web3-staking-container"
      class="p-12 h-screen w-screen flex justify-center bg-[#181818]"
    >
      <div class="flex flex-col w-full max-w-4xl space-y-12">
        <a
          id="web3-address-button"
          class="self-end px-4 py-2 bg-[#02D632] rounded-full w-fit font-bold cursor-pointer"
        >
        </a>

        <div
          id="web3-banner-container"
          class="bg-[#F9FD30] h-fit py-4 rounded-lg text-sm text-center"
        ></div>

        <h1 class="text-4xl font-bold text-white text-center">Dashboard</h1>

        <div class="grid grid-cols-4 gap-4">
          <div
            class="p-2 w-full flex flex-col border border-white rounded text-white"
          >
            Your SmartNodes
            <span id="web3-sn-amount" class="font-bold text-lg">---</span>
          </div>
          <div
            class="p-2 w-full flex flex-col border border-white rounded text-white"
          >
            Total Staked SmartNodes
            <span id="web3-total-staked-amount" class="font-bold text-lg"
              >---</span
            >
          </div>
          <div
            class="p-2 w-full flex flex-col border border-white rounded text-white"
          >
            Your Staked SmartNodes
            <span id="web3-user-total-staked-amount" class="font-bold text-lg"
              >---</span
            >
          </div>
          <div
            class="p-2 w-full flex flex-col border border-white rounded text-white"
          >
            Your Claimable Rewards
            <span id="web3-claimable-rewards" class="font-bold text-lg"
              >---</span
            >
          </div>
        </div>

        <div
          id="web3-reward-container"
          class="grid grid-cols-5 gap-4 text-white"
        >
          <!-- <div
            class="p-2 w-full flex flex-col border border-white rounded text-white"
          >
            January 2025
            <span class="font-bold text-lg">---</span>
          </div> -->
        </div>

        <div
          class="mx-auto p-8 border rounded-lg flex flex-col w-fit text-white"
        >
          <div id="web3-staking-selector" class="flex gap-4">
            <a href="#" class="cursor-pointer">Stake</a>
            <a href="#" class="cursor-pointer">Unstake</a>
          </div>

          <div class="my-4">
            <div class="flex flex-col gap-2">
              <span id="web3-amount-label" class="text-[#C5C5C5] text-xs"
                >Amount to Stake</span
              >

              <div
                class="flex items-center gap-1 border rounded-lg p-2 border-[#A8A8A8] bg-[#2C2C2C]"
              >
                <input
                  id="web3-amount-input"
                  class="w-full border-0 bg-transparent text-[#A8A8A8] outline-none"
                  type="number"
                  placeholder="0"
                  min="0"
                />
                <a
                  href="#"
                  id="web3-max-button"
                  class="underline text-[#A8A8A8]"
                >
                  MAX
                </a>
              </div>

              <input id="web3-range-input" min="0" max="100" value="1" />
            </div>
          </div>

          <div class="w-full flex items-center gap-4">
            <button id="web3-stake-trigger">Stake More SmartNodes</button>
            <a
              id="web3-buy-more-button"
              href="https://earnm.com/smartnodes-sale"
              target="_blank"
              >Buy More SmartNodes</a
            >
          </div>

          <span
            id="web3-error-text"
            class="mt-4 text-center text-[#FD2E53] text-sm font-bold"
          ></span>
        </div>
      </div>
    </div>
  </body>
</html>
